name: Windows WSL native Linux regressions

on:
  push:
    branches: [windows-wsl]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install local test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat python3-venv
      - name: Verify host user namespaces
        run: bwrap --unshare-user --unshare-net --ro-bind / / -- /bin/true
      - name: Run account-free regression suite
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s tests -v
